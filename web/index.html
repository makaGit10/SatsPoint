<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SatsPoint — encaissez en bitcoin (Lightning) ou en mobile money, en quelques secondes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <title>SatsPoint</title>
    <script>
      // Applique le thème et la langue mémorisés avant le premier rendu (aucun flash).
      (function () {
        try {
          // Thème par défaut : clair ; « auto » (mémorisé) = pas d'attribut, le système décide.
          var t = localStorage.getItem('satspoint.theme');
          if (t !== 'auto') document.documentElement.setAttribute('data-theme', t === 'sombre' ? 'sombre' : 'clair');
          var l = localStorage.getItem('satspoint.locale');
          if (l === 'en' || l === 'fr') document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
