; SatsPoint — mode « tout-en-un » (image `all`, SATSPOINT_ROLE=all) : un seul conteneur fait tourner
; Caddy+PHP (API + PWA), Reverb, le worker de files, le planificateur et la passerelle Lightning.
; Utilisé sur l'offre gratuite de Render (un seul service web, 512 Mo).
;
; Installé dans /etc/supervisor/supervisord.conf (infra/api.Dockerfile, cible `all`), lancé par infra/entrypoint.sh.
; Chaque programme HÉRITE de l'environnement de supervisord (donc de celui du conteneur : APP_KEY, DATABASE_URL,
; GATEWAY_HMAC_SECRET, ALLOW_MOCK_WALLET, REVERB_*, PORT, SERVER_NAME, API_INTERNAL_URL…) ; `environment=` n'ajoute
; ou ne remplace que les variables propres au programme. Tourne sans privilège (utilisateur www-data de l'image).
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; Caddy + PHP : écoute $PORT (SERVER_NAME=":$PORT"), proxifie /app/* vers Reverb ($REVERB_UPSTREAM).
[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/app/api
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; Temps réel : interne seulement (127.0.0.1:8080), joint par le navigateur via Caddy (/app/*).
[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/app/api
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; Files sur la base (QUEUE_CONNECTION=database) ; --memory : redémarrage propre au-delà de 96 Mo.
[program:queue]
command=php artisan queue:work --queue=paiements,audio,imports,default --tries=3 --timeout=120 --sleep=2 --max-time=3600 --memory=96
directory=/app/api
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=130
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:scheduler]
command=php artisan schedule:work
directory=/app/api
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

; Passerelle Lightning (NWC) : 127.0.0.1:3011 seulement (LIGHTNING_GATEWAY_URL côté API).
; PORT est remplacé (celui du conteneur est pour Caddy) ; elle rappelle l'API par Caddy : API_INTERNAL_URL
; (défaut http://127.0.0.1:$PORT, posé par l'entrypoint). GATEWAY_HMAC_SECRET et ALLOW_MOCK_WALLET sont hérités.
[program:lightning-gateway]
command=node --max-old-space-size=96 /app/lightning-gateway/dist/index.js
directory=/app/lightning-gateway
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PORT="3011",HOST="127.0.0.1",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50
