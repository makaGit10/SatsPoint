; SatsPoint — mode « tout-en-un » (SATSPOINT_ROLE=all) : un seul conteneur fait tourner
; Caddy+PHP, Reverb, le worker de files et le planificateur. Utilisé sur l'offre gratuite de Render.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:reverb]
command=php artisan reverb:start --host=127.0.0.1 --port=8080
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:queue]
command=php artisan queue:work --queue=paiements,audio,imports,default --tries=3 --timeout=120 --sleep=1 --max-time=3600
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:scheduler]
command=php artisan schedule:work
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[program:lightning-gateway]
command=node /app/lightning-gateway/dist/index.js
directory=/app/lightning-gateway
autostart=true
autorestart=true
environment=PORT="3011",API_INTERNAL_URL="http://127.0.0.1:8000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=50
