; SatsPoint — réglages PHP
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 6M
max_execution_time = 60
expose_php = Off
date.timezone = Africa/Dakar

; OPcache (sans effet sur le code monté en dev si validate_timestamps=1)
opcache.enable = 1
; CLI (planificateur, file, artisan) : désactivé par défaut ; activé dans l'image « all » avec un cache sur
; fichier partagé entre processus (sinon chaque `php artisan` recompile tout le code — coûteux à 0,1 CPU).
opcache.enable_cli = ${PHP_OPCACHE_CLI}
opcache.file_cache = ${PHP_OPCACHE_FILE_CACHE}
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 2

; Sessions / cookies
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
